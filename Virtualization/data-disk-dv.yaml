# VM'e sonradan (hotplug) eklenecek boş veri diski — ODF RBD, RWX Block (live migration uyumlu)
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: fedora-data-disk
  namespace: trt-ocp-poc-virt
spec:
  source:
    blank: {}
  storage:
    storageClassName: ocs-storagecluster-ceph-rbd-virtualization
    accessModes: [ReadWriteMany]
    volumeMode: Block
    resources:
      requests:
        storage: 10Gi
