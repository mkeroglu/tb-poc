# ISO'dan Windows Server 2022 kurulumu yapan geçici VM.
#   installcdrom        : virtctl image-upload / Console ile yüklenen Windows ISO'su (win2k22-iso-upload)
#   rootdisk            : 60Gi boş disk -> Windows buraya kurulur, sonra golden image olur
#   virtiocontainerdisk : Red Hat virtio-win sürücüleri (openshift-cnv/virtio-win ConfigMap'indeki imaj) -> E:\
#   sysprep             : autounattend.xml + post-install.ps1 (gözetimsiz kurulum) -> F:\
# Elle kurulum yapılacaksa sysprep volume'u çıkarılır, kurulum VNC konsolundan yapılır.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win2k22-installer
  namespace: trt-ocp-poc-win
spec:
  runStrategy: RerunOnFailure        # kurulum sonunda sysprep VM'i kapatır; VM yeniden açılmaz
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.large                   # 2 vCPU / 8Gi
  preference:
    kind: VirtualMachineClusterPreference
    name: windows.2k22.virtio        # EFI + SecureBoot + TPM, Hyper-V enlightenments, virtio bus
  dataVolumeTemplates:
    - metadata:
        name: win2k22-installer-rootdisk
      spec:
        source:
          blank: {}
        storage:
          storageClassName: ocs-storagecluster-ceph-rbd-virtualization
          accessModes: [ReadWriteMany]
          volumeMode: Block
          resources:
            requests:
              storage: 60Gi
  template:
    spec:
      domain:
        devices:
          disks:
            - name: installcdrom
              bootOrder: 2
              cdrom:
                bus: sata
            - name: rootdisk
              bootOrder: 1           # boşken atlanır -> CD'den açılır; kurulumdan sonra diskten açılır
              disk:
                bus: virtio
            - name: virtiocontainerdisk
              cdrom:
                bus: sata
            - name: sysprep
              cdrom:
                bus: sata
      volumes:
        - name: installcdrom
          persistentVolumeClaim:
            claimName: win2k22-iso-upload
        - name: rootdisk
          dataVolume:
            name: win2k22-installer-rootdisk
        - name: virtiocontainerdisk
          containerDisk:
            image: registry.redhat.io/container-native-virtualization/virtio-win-rhel9@sha256:dbbba8ff8f5d38c7b736a1814f1a5788feae399fb079ba8a5f23c7070c533308
        - name: sysprep
          sysprep:
            configMap:
              name: trt-win2k22-autounattend
