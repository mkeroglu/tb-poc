# Başka bir namespace'teki golden image'dan (DataSource/PVC) disk klonlayabilmek için izin.
# Kaynak namespace'te (trt-ocp-poc-virt), hedef namespace'in ServiceAccount'una clone yetkisi verilir.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trt-datavolume-cloner
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes/source"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-clone-to-trt-ocp-poc-virt-backup
  namespace: trt-ocp-poc-virt            # KAYNAK (golden image'ın olduğu) namespace
subjects:
  - kind: ServiceAccount
    name: default
    namespace: trt-ocp-poc-virt-backup   # HEDEF namespace
roleRef:
  kind: ClusterRole
  name: trt-datavolume-cloner
  apiGroup: rbac.authorization.k8s.io
