# Anti-affinity: 4 web VM, 3 hpe node -> 3'u farkli node'larda calisir, 4.'su Pending kalir
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: web-1
  namespace: trt-ocp-poc-virt
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small              # 1 vCPU / 2Gi
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: web-1-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: trt-web
    spec:
      affinity:
        nodeAffinity:                       # sadece 3 adet hpe node
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/hpe
                    operator: Exists
        podAntiAffinity:                    # ayni app=trt-web etiketli iki VM ayni node a DUSEMEZ
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: trt-web
              topologyKey: kubernetes.io/hostname
      domain:
        devices: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: web-1-rootdisk
