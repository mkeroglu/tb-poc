# (Pod) affinity: cache VM'i web-1 ile AYNI node'a yerlestirme
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cache-1
  namespace: trt-ocp-poc-virt
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small              # 1 vCPU / 2Gi
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: cache-1-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: trt-cache
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  vm.kubevirt.io/name: web-1   # virt-launcher podlarina KubeVirt in otomatik koydugu etiket
              topologyKey: kubernetes.io/hostname
      domain:
        devices: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: cache-1-rootdisk
