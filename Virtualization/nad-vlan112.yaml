# Mevcut br-vm linux-bridge'i (NNCP ile tüm VM node'larında kurulu, trunk) üzerinden VLAN 112'ye çıkan ağ
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-112
  namespace: trt-ocp-poc-virt
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br-vm
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vlan-112",
      "type": "bridge",
      "bridge": "br-vm",
      "vlan": 112,
      "macspoofchk": true,
      "ipam": {}
    }
