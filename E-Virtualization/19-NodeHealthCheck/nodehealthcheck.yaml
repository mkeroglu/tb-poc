# Sağlıksız worker node'ları otomatik "fence" eden (izole edip yeniden başlatan) kural.
# Node fence edildikten sonra üzerindeki pod'lar ve VM'ler başka node'larda yeniden başlatılır.
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: sekom-worker-nhc
spec:
  selector:
    matchExpressions:
      - key: node-role.kubernetes.io/worker
        operator: Exists
      - key: node-role.kubernetes.io/master          # control plane ASLA bu kurala dahil edilmez
        operator: DoesNotExist
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
      # Testte etki alanını tek bir node havuzuna daraltmak için (isteğe bağlı):
      # - key: REPLACE_ME_POOL_LABEL
      #   operator: Exists
  minHealthy: 51%          # node'ların yarısından fazlası sağlıksızsa (örn. ağ kesintisi) müdahale ETME
  unhealthyConditions:
    - type: Ready
      status: "False"
      duration: 300s
    - type: Ready
      status: Unknown
      duration: 300s
  remediationTemplate:
    apiVersion: self-node-remediation.medik8s.io/v1alpha1
    kind: SelfNodeRemediationTemplate
    name: self-node-remediation-automatic-strategy-template
    namespace: openshift-workload-availability
