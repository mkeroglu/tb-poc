# sekom-vm-from-custom-template VM'inden vm-to-template.sh ile uretildi
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: sekom-web-golden
  namespace: sekom-ocp-poc-virt
  labels:
    template.kubevirt.io/type: vm
  annotations:
    openshift.io/display-name: Sekom Web Sunucusu (httpd, golden)
    description: 'sekom-vm-from-custom-template VM''inden uretilmis template (golden
      image: DataSource sekom-ocp-poc-virt/sekom-web-golden).'
    iconClass: icon-fedora
    openshift.io/provider-display-name: Sekom
    template.kubevirt.io/provider: Sekom
    tags: kubevirt,virtualmachine,linux
objects:
- apiVersion: kubevirt.io/v1
  kind: VirtualMachine
  metadata:
    name: ${NAME}
    labels:
      app: ${NAME}
      app.kubernetes.io/part-of: sekom-ocp-poc
      kubevirt.io/dynamic-credentials-support: 'true'
    annotations:
      vm.kubevirt.io/validations: "[\n  {\n    \"name\": \"minimal-required-memory\"\
        ,\n    \"path\": \"jsonpath::.spec.domain.memory.guest\",\n    \"rule\": \"\
        integer\",\n    \"message\": \"This VM requires more memory.\",\n    \"min\"\
        : 2147483648\n  }\n]\n"
  spec:
    dataVolumeTemplates:
    - metadata:
        name: ${NAME}
      spec:
        sourceRef:
          kind: DataSource
          name: sekom-web-golden
          namespace: sekom-ocp-poc-virt
        storage:
          storageClassName: ocs-storagecluster-ceph-rbd-virtualization
          resources:
            requests:
              storage: 30Gi
    runStrategy: Always
    template:
      metadata:
        labels:
          kubevirt.io/domain: ${NAME}
          kubevirt.io/size: small
        annotations:
          vm.kubevirt.io/flavor: small
          vm.kubevirt.io/os: fedora
          vm.kubevirt.io/workload: server
      spec:
        accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: ${SSH_KEY_SECRET}
            propagationMethod:
              noCloud: {}
        architecture: amd64
        domain:
          cpu:
            cores: 1
            sockets: 1
            threads: 1
          devices:
            disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
            interfaces:
            - masquerade: {}
              model: virtio
              name: default
            rng: {}
          features:
            acpi: {}
            smm:
              enabled: true
          firmware:
            bootloader:
              efi: {}
          machine:
            type: pc-q35-rhel9.8.0
          memory:
            guest: 2Gi
          resources: {}
        networks:
        - name: default
          pod: {}
        terminationGracePeriodSeconds: 180
        volumes:
        - name: rootdisk
          dataVolume:
            name: ${NAME}
        - cloudInitNoCloud:
            userData: '#cloud-config

              user: fedora

              password: ${CLOUD_USER_PASSWORD}

              chpasswd: { expire: False }'
          name: cloudinitdisk
parameters:
- name: NAME
  description: VM adi
  generate: expression
  from: sekom-web-golden-[a-z0-9]{6}
- name: CLOUD_USER_PASSWORD
  description: cloud-init kullanicisi (fedora) sifresi
  generate: expression
  from: '[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}'
- name: SSH_KEY_SECRET
  description: VM'e enjekte edilecek SSH public key secret adi
  value: vm-ssh-key
  required: true

