# Anti-affinity: 4 web VM, REPLACE_ME_POOL_LABEL etiketli 3 node -> 3'u farkli node'larda calisir, 4.'su Pending kalir
# (Etiketli node sayısı N ise N+1 VM ile aynı sonuç görülür.)
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: web-1
  namespace: sekom-ocp-poc-virt
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small              # 1 vCPU / 2Gi
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: web-1-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: sekom-web
    spec:
      affinity:
        nodeAffinity:                       # sadece REPLACE_ME_POOL_LABEL etiketli node'lar
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: REPLACE_ME_POOL_LABEL
                    operator: Exists
        podAntiAffinity:                    # ayni app=sekom-web etiketli iki VM ayni node a DUSEMEZ
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: sekom-web
              topologyKey: kubernetes.io/hostname
      domain:
        devices: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: web-1-rootdisk
