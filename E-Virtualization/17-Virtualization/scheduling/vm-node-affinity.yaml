# Node affinity: qct rollu node'lar ZORUNLU, worker03 TERCIHLI
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: sched-node-affinity
  namespace: sekom-ocp-poc-virt
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small              # 1 vCPU / 2Gi
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: sched-node-affinity-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: sekom-sched
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/qct
                    operator: Exists
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [worker03.bedrock.linuxera.hq]
      domain:
        devices: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: sched-node-affinity-rootdisk
