# Kaynak (VMware / OVA) ağ ve disklerinin OpenShift'teki karşılıkları.
# ID'ler MTV envanterinden alınır (README bölüm 3).
apiVersion: forklift.konveyor.io/v1beta1
kind: NetworkMap
metadata:
  name: sekom-ova-network-map
  namespace: openshift-mtv
spec:
  provider:
    source:      {name: REPLACE_ME_SOURCE_PROVIDER, namespace: openshift-mtv}
    destination: {name: host, namespace: openshift-mtv}
  map:
    - source:
        id: REPLACE_ME_SOURCE_NETWORK_ID      # örn. "VM Network"
      destination:
        type: pod                              # pod ağı; LAN için: type: multus, name: <ns>/<nad>
---
apiVersion: forklift.konveyor.io/v1beta1
kind: StorageMap
metadata:
  name: sekom-ova-storage-map
  namespace: openshift-mtv
spec:
  provider:
    source:      {name: REPLACE_ME_SOURCE_PROVIDER, namespace: openshift-mtv}
    destination: {name: host, namespace: openshift-mtv}
  map:
    - source:
        id: REPLACE_ME_SOURCE_STORAGE_ID       # vSphere'de datastore, OVA'da disk dosyası
      destination:
        storageClass: ocs-storagecluster-ceph-rbd-virtualization
