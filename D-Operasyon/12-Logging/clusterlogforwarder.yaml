# clusterlogforwarder.yaml
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: collector
  namespace: openshift-logging
spec:
  serviceAccount:
    name: collector
  collector:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 4Gi          # bkz. Bölüm 7 — varsayılan limit bu clusterda OOMKilled veriyordu
  inputs:
    - name: app-logs
      type: application
      application: {}        # TÜM namespace'ler — production kullanımı; POC testinde daraltıldı, bkz. Bölüm 7
    - name: audit-logs
      type: audit
      audit: {}
  outputs:
    - name: loki-output
      type: lokiStack
      lokiStack:
        target:
          name: logging-loki
          namespace: openshift-logging
        authentication:
          token:
            from: serviceAccount
      tls:
        ca:
          key: service-ca.crt
          configMapName: openshift-service-ca.crt
  pipelines:
    - name: app-and-audit-to-loki
      inputRefs:
        - app-logs
        - audit-logs
      outputRefs:
        - loki-output
