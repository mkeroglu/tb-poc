# demo-workload.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: sekom-oadp-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: sekom-oadp-demo
data:
  greeting: "merhaba-oadp-restore-testi"
  created-at: "2026-08-12"
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: sekom-oadp-demo
type: Opaque
stringData:
  password: "s3cr3t-sekom-oadp-demo"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: sekom-oadp-demo
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "echo $(GREETING) from $(POD_NAME); sleep 3600"]
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: greeting
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: sekom-oadp-demo
spec:
  selector:
    app: demo-app
  ports:
    - port: 8080
      targetPort: 8080
