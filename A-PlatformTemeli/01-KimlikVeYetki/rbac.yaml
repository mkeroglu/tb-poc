# Sekom POC — RBAC senaryosu
#   sekom-poc-developers : dev'de "edit", prod'da sadece "view" + deployment restart (özel rol)
#   sekom-poc-viewers    : her iki namespace'te "view" (secret'ları göremez)
#   sekom-admin          : her iki namespace'in admin'i (namespace içinde yetki dağıtabilir, cluster'a dokunamaz)
apiVersion: v1
kind: Namespace
metadata:
  name: sekom-rbac-dev
  labels: {app.kubernetes.io/part-of: sekom-ocp-poc}
---
apiVersion: v1
kind: Namespace
metadata:
  name: sekom-rbac-prod
  labels: {app.kubernetes.io/part-of: sekom-ocp-poc}
---
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: sekom-poc-developers
users: [sekom-dev]
---
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: sekom-poc-viewers
users: [sekom-viewer]
---
# dev: geliştiriciler tam düzenleme yetkisi
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: developers-edit, namespace: sekom-rbac-dev}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: sekom-poc-developers}]
---
# prod: geliştiriciler sadece görüntüleyebilir...
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: developers-view, namespace: sekom-rbac-prod}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: sekom-poc-developers}]
---
# ...ve özel rolle sadece deployment'ı yeniden başlatabilir (oc rollout restart = patch)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: deployment-restarter, namespace: sekom-rbac-prod}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: developers-restart, namespace: sekom-rbac-prod}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployment-restarter}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: sekom-poc-developers}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: viewers-view, namespace: sekom-rbac-dev}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: sekom-poc-viewers}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: viewers-view, namespace: sekom-rbac-prod}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: sekom-poc-viewers}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ns-admin, namespace: sekom-rbac-dev}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: User, name: sekom-admin}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ns-admin, namespace: sekom-rbac-prod}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: User, name: sekom-admin}]
