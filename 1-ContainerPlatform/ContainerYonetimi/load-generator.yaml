apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
  namespace: trt-ocp-poc
  labels:
    app: load-generator
spec:
  parallelism: 4
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      restartPolicy: Never
      containers:
        - name: load-generator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -O- http://php-apache.trt-ocp-poc.svc.cluster.local > /dev/null; done"
