apiVersion: v1
kind: Secret
metadata:
  name: nginx-conf
  namespace: trt-ocp-poc
  labels:
    app: nginx
type: Opaque
stringData:
  nginx.conf: |
    server {
        listen       8080;
        server_name  _;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        add_header X-Served-By "trt-ocp-poc-nginx" always;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-index-html
  namespace: trt-ocp-poc
  labels:
    app: nginx
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="tr">
    <head>
      <meta charset="UTF-8">
      <title>TRT OCP POC - Nginx</title>
    </head>
    <body style="font-family: sans-serif; text-align: center; margin-top: 10%;">
      <h1>TRT OpenShift POC</h1>
      <p>Bu sayfa <code>trt-ocp-poc</code> namespace'inde çalışan Nginx Deployment'ı tarafından,
         bir ConfigMap üzerinden mount edilerek sunulmaktadır.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: trt-ocp-poc
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: index-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: index-html
          configMap:
            name: nginx-index-html
        - name: nginx-conf
          secret:
            secretName: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: trt-ocp-poc
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nginx
  namespace: trt-ocp-poc
  labels:
    app: nginx
spec:
  to:
    kind: Service
    name: nginx
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
